<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Conscia Service Desk Portal · Prototype</title>
<style>
  :root { --brand: #1e0721; --blue: #4962ff; --blue-600: #3149e6; --text: #0e080f; --muted: #6d6c75; --stroke: #cbcace; --danger: #d42431; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: #f3f4f5; color: var(--text);
    font: 400 14px/1.3 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { height: 50px; padding: 0 16px; display: flex; align-items: center; background: var(--brand); }
  main { flex: 1; display: grid; place-items: center; padding: 24px 16px; }
  form { width: 100%; max-width: 380px; background: #fff; border: 1px solid var(--stroke); border-radius: 12px; padding: 32px 24px;
    display: flex; flex-direction: column; gap: 16px; }
  h1 { margin: 0; font-size: 22px; font-weight: 500; }
  p { margin: 0; color: var(--muted); }
  label { display: flex; flex-direction: column; gap: 12px; font-weight: 500; }
  input { height: 44px; padding: 0 12px; border: 1px solid var(--stroke); border-radius: 8px; font-family: inherit; font-size: 16px; color: var(--text); }
  input:focus { outline: 0; border-color: var(--blue); box-shadow: 0 0 0 3px #e5e9ff; }
  button { height: 44px; border: 0; border-radius: 8px; background: var(--blue); color: #fff; font-family: inherit; font-size: 16px; font-weight: 500; cursor: pointer; }
  button:hover { background: var(--blue-600); }
  button:disabled { opacity: .7; cursor: progress; }
  .error { color: var(--danger); font-weight: 500; }
</style>
</head>

  var KEY = 'conscia-sdp-key';
  var from64 = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };
  function open(key) {
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: from64(P.iv) }, key, from64(P.data)).then(function (buf) {
      var html = new TextDecoder().decode(buf);
      document.open(); document.write(html); document.close();
    });
  }
  function keyFromPassword(pw) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']).then(function (base) {

    });

    var btn = document.getElementById('go'), err = document.getElementById('err');

    keyFromPassword(document.getElementById('pw').value).then(function (key) {
